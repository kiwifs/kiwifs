name: deploy demo site

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "deploy/**"
      - ".github/workflows/deploy-storybook.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build demo + storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: install deps
        run: npm ci
        working-directory: ui

      - name: build storybook
        run: npm run build-storybook
        working-directory: ui

      - name: build demo
        run: npm run build-demo
        working-directory: ui

      - name: assemble site
        run: |
          mkdir -p _site/storybook
          cp -r ui/demo-static/* _site/
          cp -r ui/storybook-static/* _site/storybook/

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy to github pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: deploy to github pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: wait before second retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - name: deploy to github pages (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Require deploy success
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_retry2.outcome == 'failure'
        run: exit 1
