name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  statuses: write

# Serialize release-please runs so concurrent pushes (e.g. dependabot storms)
# don't race the same release PR and trip transient GitHub API errors.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: >-
        ${{ steps.release.outputs.release_created
        || steps.release_retry.outputs.release_created
        || steps.release_retry_2.outputs.release_created
        || steps.release_retry_3.outputs.release_created }}
      tag_name: >-
        ${{ steps.release.outputs.tag_name
        || steps.release_retry.outputs.tag_name
        || steps.release_retry_2.outputs.tag_name
        || steps.release_retry_3.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Wait before release-please retry 1
        if: steps.release.outcome == 'failure'
        run: sleep 30

      - uses: googleapis/release-please-action@v4
        id: release_retry
        if: steps.release.outcome == 'failure'
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Wait before release-please retry 2
        if: steps.release.outcome == 'failure' && steps.release_retry.outcome == 'failure'
        run: sleep 60

      - uses: googleapis/release-please-action@v4
        id: release_retry_2
        if: steps.release.outcome == 'failure' && steps.release_retry.outcome == 'failure'
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Wait before release-please retry 3
        if: >-
          steps.release.outcome == 'failure'
          && steps.release_retry.outcome == 'failure'
          && steps.release_retry_2.outcome == 'failure'
        run: sleep 90

      - uses: googleapis/release-please-action@v4
        id: release_retry_3
        if: >-
          steps.release.outcome == 'failure'
          && steps.release_retry.outcome == 'failure'
          && steps.release_retry_2.outcome == 'failure'
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Require release-please success
        if: >-
          steps.release.outcome == 'failure'
          && steps.release_retry.outcome == 'failure'
          && steps.release_retry_2.outcome == 'failure'
          && steps.release_retry_3.outcome == 'failure'
        run: exit 1

  # ── Phase A: CI on the release-please PR ──────────────────────────
  # GITHUB_TOKEN pushes don't trigger pull_request events, so ci.yml
  # never runs on the release PR. We run CI here and report a commit
  # status named "test" on the PR head so branch protection passes.
  release-pr-ci:
    needs: release-please
    if: ${{ !needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Find open release PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:release-please--branches--main`,
            });
            if (prs.length === 0) {
              core.setOutput('found', 'false');
              return;
            }
            core.setOutput('found', 'true');
            core.setOutput('sha', prs[0].head.sha);

      - uses: actions/checkout@v4
        if: steps.pr.outputs.found == 'true'
        with:
          ref: release-please--branches--main

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.found == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend
        if: steps.pr.outputs.found == 'true'
        run: npm ci && npm run build
        working-directory: ui

      - uses: actions/setup-go@v5
        if: steps.pr.outputs.found == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        id: test
        if: steps.pr.outputs.found == 'true'
        run: |
          go mod download
          go vet ./...
          go test ./... -race -count=1
          go build -o /tmp/kiwifs .

      - name: Report CI status on PR
        if: always() && steps.pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ steps.test.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr.outputs.sha }}',
              state: success ? 'success' : 'failure',
              context: 'test',
              description: 'Release PR CI',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  # ── Phase B1: Build UI once (arch-independent) ───────────────────
  build-ui:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: ui

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  # ── Phase B2: Build release binaries (downloads shared UI) ──────
  build:
    needs: [release-please, build-ui]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
          - os: darwin
            arch: amd64
            goos: darwin
            goarch: amd64
          - os: darwin
            arch: arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=${{ needs.release-please.outputs.tag_name }}
          OUTPUT="kiwifs-${{ matrix.os }}-${{ matrix.arch }}"
          go build -ldflags="-s -w -X main.version=$VERSION" -o "$OUTPUT" .
          tar -czf "${OUTPUT}.tar.gz" "$OUTPUT"
          sha256sum "${OUTPUT}.tar.gz" > "${OUTPUT}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: kiwifs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            kiwifs-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            kiwifs-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

  upload-release:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: kiwifs-*
          path: artifacts
          merge-multiple: true

      - name: Attach binaries to release
        run: |
          mkdir -p release
          find artifacts -type f -name "*.tar.gz*" -exec cp {} release/ \;
          ls -lh release/
          gh release upload ${{ needs.release-please.outputs.tag_name }} release/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  docker:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created && vars.ENABLE_DOCKER_PUSH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          TAG=${{ needs.release-please.outputs.tag_name }}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kiwifs:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/kiwifs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Phase C2: Mirror the new tag to GitLab ─────────────────────────
  mirror-gitlab:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/mirror-gitlab.yml
    secrets: inherit

  # ── Phase C3: Tell downstream GitLab projects about the release ────
  # Set repo variable GITLAB_DOWNSTREAM_PROJECT_ID (and optionally
  # GITLAB_DOWNSTREAM_REF) plus secret GITLAB_DOWNSTREAM_TRIGGER_TOKEN
  # to enable. Skipped while the variable is unset.
  notify-gitlab:
    needs: [release-please, upload-release, mirror-gitlab]
    if: ${{ needs.release-please.outputs.release_created && vars.GITLAB_DOWNSTREAM_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger downstream pipeline
        env:
          TRIGGER_TOKEN: ${{ secrets.GITLAB_DOWNSTREAM_TRIGGER_TOKEN }}
          PROJECT_ID: ${{ vars.GITLAB_DOWNSTREAM_PROJECT_ID }}
          REF: ${{ vars.GITLAB_DOWNSTREAM_REF || 'main' }}
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          curl --fail-with-body -sS -X POST \
            --form "token=${TRIGGER_TOKEN}" \
            --form "ref=${REF}" \
            --form "variables[UPSTREAM]=kiwifs" \
            --form "variables[UPSTREAM_VERSION]=${VERSION}" \
            --form "variables[UPSTREAM_REPO]=https://gitlab.com/kiwifs/kiwifs.git" \
            "https://gitlab.com/api/v4/projects/${PROJECT_ID}/trigger/pipeline" \
            -o /dev/null -w 'GitLab responded %{http_code}\n'

  # ── Phase D: Deploy to EC2 ──────────────────────────────────────────
  # After the Docker image is pushed, SSH into the EC2 instance and
  # pull the new image. This replaces the separate deploy-cloud.yml
  # workflow which couldn't be triggered by GITHUB_TOKEN tag pushes.
  ec2-deploy:
    needs: [release-please, docker]
    if: ${{ needs.release-please.outputs.release_created && needs.docker.result == 'success' && vars.ENABLE_EC2_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KIWIFS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.KIWIFS_EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            IMAGE="${{ secrets.DOCKER_USERNAME }}/kiwifs:latest"

            docker pull "$IMAGE"

            cd /opt/kiwifs
            # Update compose to use the Docker Hub image instead of local build
            sed -i "s|image: kiwifs:latest|image: $IMAGE|" docker-compose.yml 2>/dev/null || true
            docker compose up -d kiwifs
            docker image prune -f

            echo "Deployed $IMAGE (${{ needs.release-please.outputs.tag_name }})"
