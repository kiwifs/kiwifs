# Runbook execution staleness (UC-6). Flags files under directory when a date
# field is too old or when flag_values frontmatter matches (e.g. failed runs).
# [janitor.execution_staleness]
# directory = "runbooks/"
# date_field = "last_executed"
# max_age_days = 90
#
# [janitor.execution_staleness.flag_values]
# last_outcome = "failure"

# Named nearest-neighbour spaces over frontmatter, served by
# GET /api/kiwi/similar and the kiwi_similar MCP tool. Distance is Gower's
# coefficient: numeric fields are scaled by the range observed across the
# candidate set, categorical fields compare by equality, and a field missing
# on either side is skipped rather than coerced. Field names may be dotted
# paths into nested frontmatter.
#
# Results carry a `coverage` figure and per-field contributions, because a
# high score computed over two filled fields out of nine is weak evidence.
#
# [[similarity.profiles]]
# name = "dataset"
# match = { kind = "dataset" }   # candidates: pages whose frontmatter matches
# path_prefix = "datasets/"      # optional additional subtree filter
# numeric = ["stats.rows", "stats.columns"]
# categorical = ["format", "license", "stats.ordered"]
# weights = { "stats.ordered" = 3.0 }  # unlisted fields weigh 1
