[server]
port = 3333
host = "0.0.0.0"

[storage]
root = "."

[search]
engine = "sqlite"
# semantic = false  # Enable vector search (requires embedding model config)

# Each chunk is prefixed with a rendered context string before embedding, so a
# retrieved chunk carries the page it came from instead of being a naked
# paragraph. Fields: .Title, .Path, .Headings ("Parent > Child"), .HeadingPath
# (list), .Frontmatter (map).
#
# The default is "{{ .Headings }}", which matches indexes built before this
# setting existed. CHANGING context_template REQUIRES A REINDEX
# (`kiwifs reindex`) — stored chunk text is not rewritten in place.
#
# [search.vector.chunk]
# size = 1500
# overlap = 150
# context_template = "{{ .Title }}{{ if .Headings }} > {{ .Headings }}{{ end }}"
#
# Optional sidecar: POSTed per chunk as
#   {"path","title","heading_path","headings","frontmatter","chunk"}
# and expected to return {"context": "..."}. Any failure — timeout, non-2xx,
# bad JSON, empty string — falls back to context_template rather than dropping
# the chunk. The server performs no LLM inference of its own; that is the
# hook's job if you want one.
# context_hook_url = "http://127.0.0.1:8099/context"

